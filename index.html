<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عالمنا الخاص ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); 
      color: #333; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 10px; 
    }
    
    .chat-card { 
      width: 100%; 
      max-width: 450px; 
      height: 92vh; 
      background: linear-gradient(rgba(255, 240, 245, 0.85), rgba(255, 228, 235, 0.9)), 
                  url('https://raw.githubusercontent.com/mrw88902-cyber/our-chat/main/bg.jpg') center/cover no-repeat;
      backdrop-filter: blur(3px); 
      border-radius: 25px; 
      border: 2px solid rgba(255, 182, 193, 0.6); 
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      position: relative; 
    }

    /* شاشة الدخول */
    #login-screen { 
      position: absolute; 
      inset: 0; 
      background: rgba(255, 230, 238, 0.95); 
      backdrop-filter: blur(10px); 
      z-index: 20; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 25px; 
      gap: 18px; 
      text-align: center; 
    }
    #login-screen h2 { color: #d63384; font-size: 26px; }
    .role-select { display: flex; gap: 12px; width: 100%; justify-content: center; }
    .role-btn { flex: 1; padding: 14px; border: 2px solid #ff758c; background: #fff; color: #d63384; border-radius: 15px; cursor: pointer; font-size: 22px; font-weight: bold; transition: 0.3s; }
    .role-btn.active { background: linear-gradient(45deg, #ff758c, #ff7eb3); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4); }
    input[type="password"] { width: 100%; padding: 14px; border-radius: 15px; border: 2px solid #ff758c; outline: none; text-align: center; font-size: 16px; background: #fff; color: #d63384; font-weight: bold; }
    .btn-enter { width: 100%; padding: 14px; background: linear-gradient(45deg, #ff758c, #ff4d6d); border: none; color: white; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3); }

    /* الهيدر */
    .chat-header { padding: 15px 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255, 182, 193, 0.4); display: flex; justify-content: space-between; align-items: center; }
    .header-info h3 { font-size: 18px; color: #d63384; font-weight: bold; }
    .status-text { font-size: 12px; color: #777; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #aaa; display: inline-block; }
    .status-dot.online { background-color: #25d366; box-shadow: 0 0 8px #25d366; }

    /* الرسائل */
    .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: transparent; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-break: break-word; position: relative; animation: fadeIn 0.3s ease; cursor: pointer; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-bubble.me { align-self: flex-start; background: linear-gradient(135deg, #ff758c, #ff4d6d); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.25); }
    .msg-bubble.other { align-self: flex-end; background: rgba(255, 255, 255, 0.9); color: #4a0017; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 182, 193, 0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    /* اقتباس الرد داخل الفقاعة */
    .quoted-reply { background: rgba(0, 0, 0, 0.1); border-right: 3px solid #ff4d6d; padding: 5px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 6px; opacity: 0.9; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .msg-bubble.other .quoted-reply { background: rgba(255, 117, 140, 0.15); border-right-color: #ff758c; }

    .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 10px; opacity: 0.8; margin-top: 4px; }
    .seen-mark.seen { color: #80d8ff; }
    .msg-bubble.other .seen-mark.seen { color: #0084ff; }

    /* منطقة الرد المعاينة فوق الكتابة */
    .reply-preview { display: none; background: rgba(255, 255, 255, 0.9); padding: 8px 12px; border-top: 1px solid rgba(255, 182, 193, 0.4); border-right: 4px solid #ff4d6d; justify-content: space-between; align-items: center; font-size: 13px; color: #d63384; }
    .reply-preview .close-reply { cursor: pointer; color: #888; font-weight: bold; font-size: 16px; margin-left: 10px; }

    /* منطقة الكتابة */
    .input-area { padding: 12px 15px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); border-top: 1px solid rgba(255, 182, 193, 0.3); display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 12px 16px; border-radius: 20px; border: 1.5px solid #ff758c; background: #fff; color: #4a0017; outline: none; font-size: 14px; text-align: right; }
    .input-area button { padding: 12px 20px; border-radius: 20px; border: none; background: linear-gradient(45deg, #ff758c, #ff7eb3); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 3px 10px rgba(255, 117, 140, 0.3); }
    .input-area button:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div class="chat-card">
  <!-- شاشة اختيار الشخص والدخول -->
  <div id="login-screen">
    <h2>مين بيتكلم؟ ❤️</h2>
    <div class="role-select">
      <button class="role-btn active" id="roleHer" onclick="selectRole('👸🏻')">👸🏻</button>
      <button class="role-btn" id="roleMe" onclick="selectRole('🤴🏻')">🤴🏻</button>
    </div>
    <input type="password" id="passCode" placeholder="كلمة السر">
    <button class="btn-enter" onclick="login()">دخول الشات ✨</button>
  </div>

  <!-- الهيدر -->
  <div class="chat-header">
    <div class="header-info">
      <h3 id="partnerTitle">الشات الخاص ❤️</h3>
      <div class="status-text">
        <span class="status-dot" id="partnerDot"></span>
        <span id="partnerStatus">غير متصل</span>
      </div>
    </div>
  </div>

  <!-- الرسائل -->
  <div class="messages-area" id="messagesArea"></div>

  <!-- شريط معاينة الرد -->
  <div class="reply-preview" id="replyPreview">
    <div>
      <small style="display:block; color:#888; font-size:10px;">الرد على:</small>
      <span id="replyText">...</span>
    </div>
    <span class="close-reply" onclick="cancelReply()">✕</span>
  </div>

  <!-- الإدخال -->
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="اكتب رسالتك..." autocomplete="off">
    <button id="sendBtn">إرسال</button>
  </div>
</div>

<script>
  let selectedRole = "👸🏻";
  let activeReply = null;

  function selectRole(role) {
    selectedRole = role;
    document.getElementById("roleHer").classList.toggle("active", role === "👸🏻");
    document.getElementById("roleMe").classList.toggle("active", role === "🤴🏻");
  }

  function login() {
    const pass = document.getElementById("passCode").value.trim();
    const valid = ["15/8", "15-8", "15/08", "١٥/٨"];
    if (valid.includes(pass)) {
      document.getElementById("login-screen").style.display = "none";
      if (window.startChatApp) window.startChatApp(selectedRole);
    } else {
      alert("كلمة السر غير صحيحة 😅");
    }
  }

  function cancelReply() {
    activeReply = null;
    document.getElementById('replyPreview').style.display = 'none';
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded, onValue, set, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAPYJt5YFdGQH2XFYqkkJi7WHxQw9BLvQc",
    authDomain: "my-life-f3893.firebaseapp.com",
    databaseURL: "https://my-life-f3893-default-rtdb.firebaseio.com",
    projectId: "my-life-f3893",
    storageBucket: "my-life-f3893.firebasestorage.app",
    messagingSenderId: "229081546680",
    appId: "1:229081546680:web:ca1c9a2120cd870e55594d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  signInAnonymously(auth).catch(console.error);

  window.startChatApp = function(userRole) {
    const partnerRole = userRole === '👸🏻' ? '🤴🏻' : '👸🏻';
    document.getElementById('partnerTitle').textContent = `الشات مع ${partnerRole}`;

    const messagesRef = ref(db, 'private_chat/messages');
    const myPresenceRef = ref(db, `private_chat/presence/${userRole}`);
    const partnerPresenceRef = ref(db, `private_chat/presence/${partnerRole}`);
    const connectedRef = ref(db, '.info/connected');

    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        set(myPresenceRef, { online: true, time: Date.now() });
        onDisconnect(myPresenceRef).set({ online: false, time: Date.now() });
      }
    });

    onValue(partnerPresenceRef, (snap) => {
      const data = snap.val();
      const dot = document.getElementById('partnerDot');
      const statusText = document.getElementById('partnerStatus');
      if (data && data.online) {
        dot.classList.add('online');
        statusText.textContent = "متصل الآن";
        statusText.style.color = "#25d366";
      } else {
        dot.classList.remove('online');
        statusText.textContent = "غير متصل";
        statusText.style.color = "#888";
      }
    });

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const txt = input.value.trim();
      if (txt !== "") {
        const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const msgData = {
          sender: userRole,
          text: txt,
          time: timeStr,
          seen: false,
          ts: Date.now()
        };

        if (window.activeReply) {
          msgData.replyTo = window.activeReply;
        }

        push(messagesRef, msgData);
        input.value = "";
        window.cancelReply();
      }
    }

    document.getElementById('sendBtn').onclick = sendMsg;
    document.getElementById('msgInput').onkeydown = (e) => { if (e.key === 'Enter') sendMsg(); };

    onChildAdded(messagesRef, (snap) => {
      const id = snap.key;
      const val = snap.val();

      if (val.sender !== userRole && !val.seen) {
        update(ref(db, `private_chat/messages/${id}`), { seen: true });
      }

      renderMsg(id, val, userRole);
    });

    onValue(messagesRef, (snap) => {
      const msgs = snap.val();
      if (!msgs) return;
      for (let id in msgs) {
        const elem = document.getElementById(`m-${id}`);
        if (elem && msgs[id].seen) {
          const mark = elem.querySelector('.seen-mark');
          if (mark) {
            mark.classList.add('seen');
            mark.textContent = '✓✓';
          }
        }
      }
    });
  };

  function renderMsg(id, val, currentUser) {
    const area = document.getElementById('messagesArea');
    const isMe = val.sender === currentUser;
    const div = document.createElement('div');
    div.id = `m-${id}`;
    div.className = `msg-bubble ${isMe ? 'me' : 'other'}`;

    // إعداد الرد المقتبس إن وجد
    let replyHtml = '';
    if (val.replyTo) {
      replyHtml = `<div class="quoted-reply"><b>${escapeHtml(val.replyTo.sender)}:</b> ${escapeHtml(val.replyTo.text)}</div>`;
    }

    const seenHtml = isMe ? `<span class="seen-mark ${val.seen ? 'seen' : ''}">${val.seen ? '✓✓' : '✓'}</span>` : '';

    div.innerHTML = `
      ${replyHtml}
      <div>${escapeHtml(val.text)}</div>
      <div class="msg-meta">
        <span>${val.time || ''}</span>
        ${seenHtml}
      </div>
    `;

    // عند الضغط على أي رسالة يتم تفعيل الرد عليها
    div.onclick = () => {
      window.activeReply = { sender: val.sender, text: val.text };
      document.getElementById('replyText').textContent = `${val.sender}: ${val.text}`;
      document.getElementById('replyPreview').style.display = 'flex';
      document.getElementById('msgInput').focus();
    };

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function escapeHtml(t) {
    return t.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }
</script>
</body>
</html>
